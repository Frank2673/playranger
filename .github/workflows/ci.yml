name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies (no browser download)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pillow

      - name: Lint (ruff)
        run: ruff check playranger tests
        continue-on-error: true

      - name: Unit tests (no hardware)
        run: pytest tests/test_adapters.py -v

      - name: Import smoke (package works without browser)
        run: python -c "import playranger; from playranger.core.engines.adapters import probe_all; print(probe_all()['web'])"

      - name: Doctor (JSON)
        run: playranger doctor --json > doctor.json
        continue-on-error: true

      - name: Upload doctor report
        uses: actions/upload-artifact@v4
        with:
          name: doctor-${{ matrix.os }}-py${{ matrix.python }}
          path: doctor.json
          if-no-files-found: ignore

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
